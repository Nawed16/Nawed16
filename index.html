<style>
:root{--ink:#0f3d34;--green:#13a06a;--wa:#1faa59;--paper:#f4f8f6;--white:#fff;--line:#d3e2db;--muted:#4f6b63;--foil:#f0b43a;--r:14px;
--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Hind","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font:400 17px/1.6 var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--foil);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,42px);max-width:18ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font:600 16px var(--body);text-decoration:none;border:2px solid var(--ink);background:transparent;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:8px 16px;font-size:15px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font:800 20px var(--head);text-decoration:none;display:flex;align-items:center;gap:10px}
.cross{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;place-items:center}
.cross i{position:relative;width:14px;height:14px;display:block}
.cross i:before,.cross i:after{content:"";position:absolute;background:#fff;border-radius:2px}
.cross i:before{left:5px;top:0;width:4px;height:14px}.cross i:after{top:5px;left:0;height:4px;width:14px}
.nav{display:flex;gap:22px;font-weight:500}
.nav a{text-decoration:none;opacity:.85}.nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
@media(max-width:820px){.nav{display:none}}
/* hero */
.hero{background:var(--ink);color:#fff;padding:48px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1)}
.dot{width:10px;height:10px;border-radius:50%;background:#8a9b95}
.open .dot{background:#3be08a;box-shadow:0 0 0 4px rgba(59,224,138,.25)}
.hero h1{font-size:clamp(38px,6vw,68px);margin:20px 0 14px}
.hi{font-size:20px;color:#bfe3d4;margin-bottom:12px;font-weight:500}
.hero p.lead{max-width:46ch;color:#d4e6df}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .btn:not(.wa){border-color:rgba(255,255,255,.5);color:#fff}
/* Rx slip */
.slip{background:#fff;color:var(--ink);border-radius:var(--r);padding:26px 24px 22px;position:relative;transform:rotate(1.2deg);box-shadow:0 24px 50px -20px rgba(0,0,0,.55)}
